<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <rect width="1280" height="320" fill="#0A0A0B"></rect>

  <!-- horizontal identity lines -->
  <g opacity="0.06">
    <rect x="0" y="20" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="40" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="60" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="80" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="100" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="120" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="140" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="160" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="180" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="200" width="1280" height="2" fill="#F5F5F7"></rect>
    <rect x="0" y="220" width="1280" height="2" fill="#F5F5F7"></rect>
