  <!-- subtle cyan signal -->
  <rect x="830" y="110" width="6" height="6" fill="#00A3E0"></rect>

  <!-- tagline -->
  <text x="640" y="200" text-anchor="middle" fill="#F5F5F7" opacity="0.7" font-size="18">
    BUILD • SYSTEMS • PRODUCTS • FUTURE
  </text>
